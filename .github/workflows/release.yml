name: release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and verify
    if: ${{ !contains(github.event.head_commit.message || '', '[skip release]') }}
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Resolve next version
        id: meta
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $message = $env:COMMIT_MESSAGE
          if ([string]::IsNullOrWhiteSpace($message)) {
              $message = 'chore: automated release'
          }

          $trailer = [regex]::Match(
              $message,
              '(?im)^Version-Bump:\s*(major|minor|patch)\s*$')
          if ($trailer.Success) {
              $bump = $trailer.Groups[1].Value.ToLowerInvariant()
          }
          else {
              $subject = ($message -split '\r?\n')[0]
              if ($message -match '(?im)^BREAKING CHANGE:' -or
                  $subject -match '^[A-Za-z][A-Za-z0-9_-]*(\([^)]+\))?!:') {
                  $bump = 'major'
              }
              elseif ($subject -match '^feat(\([^)]+\))?:') {
                  $bump = 'minor'
              }
              else {
                  $bump = 'patch'
              }
          }

          $version = (& ./scripts/version.ps1 -Bump $bump -DryRun).Trim()
          "bump=$bump" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version bump: $bump -> $version"

      - name: Restore
        run: dotnet restore PkgForge.slnx

      - name: Verify formatting
        run: dotnet format PkgForge.slnx --verify-no-changes --no-restore

      - name: Run regression suite
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -Version '${{ steps.meta.outputs.version }}'

      - name: Build binary release
        shell: pwsh
        run: ./scripts/release.ps1 -Version '${{ steps.meta.outputs.version }}' -NoSource

      - name: Verify packaged AOT binary
        shell: pwsh
        env:
          PKGFORGE_CLI_PATH: ${{ github.workspace }}\releases\v${{ steps.meta.outputs.version }}\win-x64\pkgforge.exe
        run: |
          & $env:PKGFORGE_CLI_PATH --version
          dotnet .\tests\PkgForge.Tests\bin\Release\net10.0\PkgForge.Tests.dll

      - name: Commit release version
        id: commit
        shell: pwsh
        run: |
          $version = '${{ steps.meta.outputs.version }}'
          & ./scripts/version.ps1 -Set $version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
              throw 'VERSION did not change after the release build.'
          }
          git commit -m "chore(release): v$version [skip release]"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          "release_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            releases/pkgforge-${{ steps.meta.outputs.version }}-win-x64.zip
            releases/release-manifest.json
            releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: replace release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Replace releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        run: |
          set -euo pipefail
          repo="$GH_REPO"

          # Remove every existing release. This intentionally removes release
          # history so the repository exposes only the current build.
          mapfile -t old_releases < <(
            gh release list --repo "$repo" --limit 1000 --json tagName --jq '.[].tagName'
          )
          for old_tag in "${old_releases[@]:-}"; do
            if [ -n "$old_tag" ]; then
              gh release delete "$old_tag" --repo "$repo" --yes --cleanup-tag
            fi
          done

          # Remove remaining version tags that were not attached to a release.
          git fetch --tags --force
          while IFS= read -r old_tag; do
            if [ -n "$old_tag" ]; then
              git push origin --delete "$old_tag" || true
            fi
          done < <(git tag -l 'v*')

          {
            echo "pkgforge $RELEASE_VERSION"
            echo
            echo "Windows x64 NativeAOT release."
            echo
            echo "## Changes"
            echo
            awk 'BEGIN { in_section = 0 } /^## / { if (in_section) exit; in_section = 1 } in_section { print }' CHANGELOG.md
            echo
            echo "## Assets"
            echo
            echo "- pkgforge-$RELEASE_VERSION-win-x64.zip"
            echo "- release-manifest.json"
            echo "- SHA256SUMS.txt"
            echo
            echo "The source code for this release is available from the tagged commit."
            echo "See README.md and SECURITY.md in the source tree."
          } > release-notes.md

          gh release create "$RELEASE_TAG" \
            "release-assets/pkgforge-$RELEASE_VERSION-win-x64.zip" \
            "release-assets/release-manifest.json" \
            "release-assets/SHA256SUMS.txt" \
            --repo "$repo" \
            --target "$RELEASE_SHA" \
            --title "pkgforge $RELEASE_VERSION" \
            --notes-file release-notes.md \
            --latest
